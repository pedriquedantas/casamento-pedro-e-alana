<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmados - Casamento Pedro & Alana</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f4f1ec;
        color: #2c2c2c;
        padding: 30px 20px;
        line-height: 1.5;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #b0a48f;
    }
    header h1 {
        font-size: 1.9rem;
        color: #5a4f3f;
        font-weight: 700;
        letter-spacing: 1px;
    }
    header p { color: #7a7060; margin-top: 6px; font-size: 0.95rem; }
    .resumo {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin: 20px 0 30px;
        flex-wrap: wrap;
    }
    .resumo-item { text-align: center; }
    .resumo-num { font-size: 1.8rem; font-weight: 700; color: #5a4f3f; }
    .resumo-label { font-size: 0.8rem; color: #7a7060; text-transform: uppercase; letter-spacing: 1px; }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        border-radius: 8px;
        overflow: hidden;
    }
    thead { background: #5a4f3f; color: #fff; }
    th, td { padding: 12px 14px; text-align: left; vertical-align: top; font-size: 0.85rem; }
    th { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.75rem; }
    tbody tr:nth-child(even) { background: #faf8f4; }
    tbody tr { border-bottom: 1px solid #eee; }
    .col-num { width: 30px; text-align: center; color: #999; }
    .col-nome { font-weight: 600; color: #3a3428; }
    .col-presente { color: #6b5d45; }
    .col-msg { color: #888; font-style: italic; font-size: 0.8rem; }
    .col-data { white-space: nowrap; color: #999; font-size: 0.8rem; }
    .col-qtd { text-align: center; white-space: nowrap; }
    .badge {
        display: inline-block;
        min-width: 24px;
        padding: 2px 8px;
        border-radius: 12px;
        background: #e8e2d5;
        color: #5a4f3f;
        font-weight: 600;
        font-size: 0.8rem;
    }
    .badge.grupo { background: #c9a86a; color: #fff; }
    .subtitulo {
        margin: 40px 0 15px;
        font-size: 1.3rem;
        color: #5a4f3f;
        font-weight: 700;
        border-left: 4px solid #c9a86a;
        padding-left: 12px;
    }
    footer { text-align: center; margin-top: 30px; color: #a09884; font-size: 0.85rem; }
    @media print {
        body { background: #fff; padding: 0; }
        table { box-shadow: none; }
        thead { background: #5a4f3f !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>
</head>
<body>
<div class="container">

        </div>
        <div class="resumo-item">

        </div>

            <div class="resumo-num">37</div>
            <div class="resumo-label">Presentes Escolhidos</div>

    </div>

    <table>

            <tr>

                <th>Data</th>
                <th>Nome</th>
                <th class="col-qtd">Pessoas</th>
                <th>Presente(s)</th>

</div>

document.getElementById('totalConfirmacoes').textContent = dados.length + dadosExtra.length;
</script>
</body>
</html>
